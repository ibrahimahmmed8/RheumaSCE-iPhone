:root{color-scheme:light;--bg:#f8fafc;--panel:#ffffff;--line:#e2e8f0;--blue:#155e9a;--muted:#64748b;--green:#dcfce7;--red:#fee2e2}*{box-sizing:border-box}body{background:var(--bg);color:#14263a;font:15px/1.5 system-ui,-apple-system,sans-serif;margin:0}main{max-width:760px;margin:auto;padding:18px 18px 105px}header{position:sticky;top:0;background:#ffffffef;z-index:10;padding:14px 18px;border-bottom:1px solid var(--line)}header>div{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;color:var(--blue);margin:0;letter-spacing:-.4px}small,.muted{color:var(--muted)}h2{font-size:25px;line-height:1.25;margin:20px 0 8px}h3{font-size:17px;margin:20px 0 10px}.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin:10px 0}.click{cursor:pointer}.click:active{filter:brightness(1.2)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stats .card{text-align:center;margin:0;padding:12px 6px}.metric{font-size:24px;font-weight:800;color:var(--blue)}button{background:#155e9a;color:#fff;border:1px solid #155e9a;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}button.primary{background:#155e9a}button.ghost{background:transparent;border-color:var(--line);color:var(--blue)}button:disabled{opacity:.4}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}input{background:var(--panel);color:#14263a;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;width:100%}.navbar{position:fixed;bottom:0;left:0;right:0;background:#ffffff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px max(9px,env(safe-area-inset-bottom));z-index:12}.navbar button{font-size:13px;border:0;background:transparent;flex:1;color:var(--muted);padding:8px 4px}.navbar button.active{color:var(--blue);font-weight:700}.option{width:100%;text-align:left;color:#14263a;background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:10px;border-radius:12px}.option.correct{background:var(--green)}.option.wrong{background:var(--red)}.pill{color:var(--blue);font-size:12px;font-weight:650;letter-spacing:.2px}.question{font-size:19px;line-height:1.45;font-weight:650;margin:15px 0 20px}.explanation{border-left:3px solid var(--blue);background:var(--panel);border-radius:8px;padding:14px;margin-top:16px}.list{list-style:none;padding:0}.list>li{margin:8px 0}.footer{display:flex;gap:8px;justify-content:space-between;margin:22px 0}.progress{height:5px;background:var(--line);border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--blue)}.empty{padding:32px 10px;text-align:center;color:var(--muted)}.bookmark{font-size:22px;border:0;background:transparent;padding:4px 8px}#app[aria-busy=true]{opacity:.75}
