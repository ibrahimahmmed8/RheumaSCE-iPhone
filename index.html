<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4e9dc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>RheumaSCE — Rheumatology Revision</title><style>
:root{color-scheme:light;--bg:#f4e9dc;--panel:#fffaf2;--line:#e4d4c1;--blue:#87452f;--ink:#372e29;--muted:#66574d;--correct:#e5f0de;--wrong:#fae4df;--answer:#315e39;--scale:1;--reading-line:1.78}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:calc(17px * var(--scale))/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:auto;padding:20px 18px calc(110px + env(safe-area-inset-bottom));min-height:65vh}
header{position:sticky;top:0;background:var(--panel);z-index:10;padding:12px 16px;border-bottom:1px solid var(--line)}
header>div{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-actions{display:flex;gap:7px;align-items:center;flex-shrink:0}
h1{font-size:21px;color:var(--blue);margin:0;letter-spacing:-.3px;line-height:1.2}
header small{display:block;max-width:360px;font-size:12px;line-height:1.4;margin-top:4px}
small,.muted{color:var(--muted)}
h2{font-size:clamp(22px,5vw,27px);line-height:1.3;margin:20px 0 12px;letter-spacing:-.3px}
h3{font-size:19px;margin:24px 0 12px}
p{margin:.75em 0;line-height:var(--reading-line)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 2px 9px #65432b0b}
.click{cursor:pointer}.click:active{background:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:19px 0}.stats .card{text-align:center;margin:0;padding:14px 5px}.stats small{font-size:12px}
.metric{font-size:25px;font-weight:750;color:var(--blue)}
button{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer;min-height:44px}
button.primary{background:var(--blue)}button.ghost{background:var(--panel);border-color:var(--line);color:var(--blue)}button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input{background:var(--panel);color:var(--ink);padding:15px;border:1px solid var(--line);border-radius:12px;font:inherit;width:100%}
.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px max(9px,env(safe-area-inset-bottom));z-index:12}
.navbar button{font-size:13px;border:0;background:transparent;flex:1;color:var(--muted);padding:10px 4px;min-height:44px}.navbar button.active{color:var(--blue);font-weight:750}
.option{display:block;width:100%;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:17px;margin-bottom:12px;border-radius:13px;line-height:1.65;font-size:calc(17px * var(--scale));min-height:58px;overflow-wrap:anywhere}
.option.correct{background:var(--correct);border-color:#a9c99a;opacity:1}.option.wrong{background:var(--wrong);border-color:#e6b3a4;opacity:1}
.pill{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:.1px;line-height:1.5}
.question{font-size:calc(21px * var(--scale));line-height:1.62;font-weight:650;margin:23px 0 25px;overflow-wrap:anywhere;letter-spacing:-.1px}
.explanation{border-left:4px solid var(--blue);background:var(--panel);border-radius:10px;padding:19px 19px 22px;margin-top:22px;font-size:calc(17px * var(--scale));line-height:var(--reading-line);overflow-wrap:anywhere}
.explanation b{display:block;color:var(--answer);line-height:1.6}.explanation p{margin:12px 0 0;white-space:pre-line}
.list{list-style:none;padding:0}.list>li{margin:8px 0}
.footer{display:flex;gap:12px;justify-content:space-between;margin:28px 0}.footer button{flex:1}
.progress{height:6px;background:var(--line);border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--blue)}
.empty{padding:32px 10px;text-align:center;color:var(--muted)}.bookmark{font-size:24px;border:0;background:transparent;color:var(--blue);padding:4px 8px}#app[aria-busy=true]{opacity:.75}
.reader-settings{position:fixed;top:75px;right:max(12px,calc((100vw - 720px)/2));width:min(330px,calc(100vw - 24px));padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 35px #533d2d24;z-index:30}
.reader-settings[hidden]{display:none}.reader-settings h2{margin:0 0 12px;font-size:18px}.setting-buttons{display:flex;gap:9px;margin:9px 0 17px}.setting-buttons button{flex:1;min-width:0}.setting-label{font-size:14px;font-weight:700;margin:8px 0}.theme-choices{display:flex;gap:7px;flex-wrap:wrap}.theme-choices button{font-size:13px;padding:9px 11px}
#reader-toggle{font-size:16px;font-weight:700;padding:7px 10px;min-height:39px}
body[data-theme="white"]{--bg:#fafbfc;--panel:#fff;--line:#e1e7ed;--blue:#185b92;--ink:#263442;--muted:#586b7a}
body[data-theme="dark"]{color-scheme:dark;--bg:#141b24;--panel:#202b38;--line:#354556;--blue:#9dcaf4;--ink:#edf3f8;--muted:#bdcbd6;--correct:#234b37;--wrong:#56323a;--answer:#a3f3bb}
body[data-theme="dark"] button.primary{background:#b0d7fa;color:#142232;border-color:#b0d7fa}
body[data-theme="dark"] .option.correct{border-color:#4f946d}body[data-theme="dark"] .option.wrong{border-color:#af6674}
@media(max-width:440px){header small{font-size:11px}main{padding-left:15px;padding-right:15px}.question{font-size:calc(20px * var(--scale))}.stats{gap:7px}.stats .card{padding:12px 4px}.footer{gap:8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><header><div><div><h1>RheumaSCE</h1><small>Your companion for Rheumatology SCE and related exams</small></div><div class="header-actions"><button class="ghost" id="reader-toggle" aria-label="Reading settings" aria-expanded="false" aria-controls="reader-settings">Aa</button><button class="ghost" id="back" hidden>← Back</button></div></div></header><section class="reader-settings" id="reader-settings" aria-label="Reading settings" hidden><h2>Reading comfort</h2><div class="setting-label">Text size</div><div class="setting-buttons"><button class="ghost" id="text-smaller" aria-label="Decrease text size">A−</button><button class="ghost" id="text-reset">Reset</button><button class="ghost" id="text-larger" aria-label="Increase text size">A+</button></div><div class="setting-label">Page appearance</div><div class="theme-choices"><button class="ghost" data-reader-theme="warm">Warm parchment</button><button class="ghost" data-reader-theme="white">White</button><button class="ghost" data-reader-theme="dark">Night</button></div></section><main id="app" aria-live="polite">Loading question bank…</main><nav class="navbar" id="nav"><button data-tab="home">⌂ Home</button><button data-tab="topics">▤ Topics</button><button data-tab="search">⌕ Search</button><button data-tab="saved">☆ Saved</button></nav><script src="app.js?v=warm3" defer></script></body></html>
